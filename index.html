<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sleep">
  <title>Sleep / Wake</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <section id="chooser" class="chooser" hidden>
      <button type="button" id="choose-sleep">SLEEP</button>
      <button type="button" id="choose-awake">AWAKE</button>
    </section>

    <section id="active" class="active" hidden>
      <div id="status" class="status" aria-live="polite">
        <span id="icon-sleep" class="status-icon" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998z"/>
          </svg>
        </span>
        <span id="icon-awake" class="status-icon" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12 2.25a.75.75 0 0 1 .75.75v2.25a.75.75 0 0 1-1.5 0V3a.75.75 0 0 1 .75-.75ZM7.5 12a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM18.894 6.166a.75.75 0 0 0-1.06-1.06l-1.591 1.59a.75.75 0 1 0 1.06 1.061l1.591-1.59ZM21.75 12a.75.75 0 0 1-.75.75h-2.25a.75.75 0 0 1 0-1.5H21a.75.75 0 0 1 .75.75ZM17.834 18.894a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 1 0-1.061 1.06l1.59 1.591ZM12 18a.75.75 0 0 1 .75.75V21a.75.75 0 0 1-1.5 0v-2.25A.75.75 0 0 1 12 18ZM7.758 17.303a.75.75 0 0 0-1.061-1.06l-1.591 1.59a.75.75 0 0 0 1.06 1.061l1.591-1.59ZM6 12a.75.75 0 0 1-.75.75H3a.75.75 0 0 1 0-1.5h2.25A.75.75 0 0 1 6 12ZM6.697 7.757a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 0 0-1.061 1.06l1.59 1.591Z"/>
          </svg>
        </span>
      </div>
      <p id="time" class="time">00:00:00</p>
      <button type="button" id="switch"></button>
    </section>
  </main>

  <div id="scrim" class="scrim" hidden></div>

  <aside id="history" class="history" aria-hidden="true">
    <h1>History</h1>
    <div id="history-list" class="history-list"></div>
  </aside>

  <div class="history-controls">
    <button type="button" id="history-toggle" class="history-toggle" aria-expanded="false">History</button>
  </div>

  <div id="editor" class="editor" hidden>
    <div class="editor-card" role="dialog" aria-labelledby="editor-title">
      <h2 id="editor-title">Edit State Change</h2>
      <p id="editor-state" class="editor-state"></p>
      <p id="editor-time" class="editor-time"></p>
      <p id="editor-error" class="editor-error" hidden></p>
      <button type="button" id="editor-now">Change to now</button>
      <button type="button" id="editor-cancel" class="editor-cancel">Cancel</button>
    </div>
  </div>

  <script src="./vendor/supabase.js"></script>
  <script src="./supabase-config.js"></script>
  <script src="./script.js"></script>
</body>
</html>
